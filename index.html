<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesamtrangliste</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

  <!-- Eigene Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
</head>

<body>

<header class="header">
  <img src="logo.png" alt="Vereinslogo" class="logo">
  <h1>Gesamtrangliste</h1>
</header>

<div class="controls">
  <label>
    Wertung:
    <select id="wertungFilter">
      <option value="Netto" selected>Netto</option>
      <option value="Brutto D">Brutto Damen</option>
      <option value="Brutto H">Brutto Herren</option>
    </select>
  </label>

  <label>
    Mannschaft:
    <select id="teamFilter">
      <option value="">Alle Mannschaften</option>
    </select>
  </label>

  <label>
    Events:
    <select id="eventFilter" multiple size="4">
      <option value="ALL" selected>Alle Events</option>
    </select>
    <span class="hint">Mehrfachauswahl möglich</span>
  </label>
</div>

<!-- Siegerbox -->
<div id="siegerBox" class="sieger-box"></div>

<!-- Rangliste -->
<table id="rankingTable" class="display">
  <thead>
    <tr>
      <th>Rang</th>
      <th>Vorname</th>
      <th>Nachname</th>
      <th>Team</th>
      <th>Punkte</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- App-Logik -->
<script src="app.js"></script>

</body>
</html>
